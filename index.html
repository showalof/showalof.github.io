<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>🫶🏽</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500&family=Charmonman:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap');

    :root{ --paper:#fdfbf7; --ink:#2b2b2b; }

    body {
      margin: 0;
      font-family: 'Anuphan', sans-serif;
      background: #f3f1ec;
      color: var(--ink);
    }

    header {
      padding: 28px 16px;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 600;
      background: linear-gradient(180deg, #fdfbf7, #f6f2ea);
      border-bottom: 1px solid #e5e0d8;
      letter-spacing: 0.04em;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    .code-page { text-align: center; }

    .code-page input {
      padding: 14px;
      width: 100%;
      max-width: 320px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 16px;
    }

    .code-page button {
      padding: 12px 28px;
      font-size: 16px;
      border-radius: 999px;
      border: none;
      background: #2b2b2b;
      color: white;
      cursor: pointer;
    }

    .envelope-page { display:none; text-align:center; }

    .envelope {
      width: 280px;
      height: 180px;
      margin: 80px auto;
      position: relative;
      background: linear-gradient(180deg,#fffdf8,#f1ece4);
      border: 1px solid #d6d0c6;
      border-radius: 8px;
      box-shadow: 0 18px 36px rgba(0,0,0,0.18);
      cursor: pointer;
      transition: transform .4s ease;
      overflow: hidden;
    }

    .envelope:hover { transform: translateY(-8px); }

    .flap {
      position:absolute;
      top:0; left:0; right:0;
      height:56%;
      background: linear-gradient(180deg,#f6f2ea,#e7e2d9);
      clip-path: polygon(0 0,100% 0,50% 70%);
      transform-origin: top center;
      transition: transform .9s cubic-bezier(.2,.7,.2,1);
      z-index:3;
    }

    .envelope.open .flap { transform: rotateX(180deg); }

    .letter-inside {
      position:absolute;
      left:8%; right:8%; bottom:6%;
      height:72%;
      background: var(--paper);
      border-radius:6px;
      box-shadow:0 8px 16px rgba(0,0,0,0.14);
      transform: translateY(42%);
      transition: transform .9s cubic-bezier(.2,.7,.2,1);
      z-index:1;
    }

    .envelope.open .letter-inside { transform: translateY(-6%); }

    .sender {
      position:absolute;
      bottom:14px;
      right:18px;
      font-family:'Charmonman', cursive;
      font-size:22px;
      opacity:0;
      transition: opacity .3s ease;
      z-index:4;
    }

    .envelope:hover .sender { opacity:1; }

    .letter-page { display:none; }

    .letter-paper {
      background: var(--paper);
      padding: 46px 40px;
      border-radius: 16px;
      box-shadow: 0 22px 44px rgba(0,0,0,0.14);
      font-family: 'Cormorant Garamond', serif;
    }

    .letter-text {
      white-space: pre-wrap;
      line-height: 2;
      font-size: 21px;
      min-height: 220px;
    }

    .signature {
      margin-top: 56px;
      text-align: right;
      font-size: 28px;
      font-family: 'Charmonman', cursive;
      transform: rotate(-3deg);
      opacity:0;
      transition: opacity 1.6s ease;
    }

    .signature.show { opacity:1; }

    .error { color:#b00020; margin-top:12px; }

    @media (max-width:480px) {
      header{font-size:26px}
      .letter-paper{padding:30px 24px}
      .letter-text{font-size:18px}
      .signature{font-size:22px}
    }
  </style>
</head>
<body>

<header>โชฝากข้อความถึงคุณ!</header>

<div class="container">

  <div id="codePage" class="code-page">
    <p>ใส่รหัสลับ</p>
    <input id="codeInput" type="text" placeholder="ใส่รหัสตรงนี้" />
    <br />
    <button id="confirmBtn">Confirm</button>
    <div id="errorMsg" class="error"></div>
  </div>

  <div id="envelopePage" class="envelope-page">
    <div id="envelope" class="envelope">
      <div class="flap"></div>
      <div class="letter-inside"></div>
      <div id="senderName" class="sender"></div>
    </div>
    <p>เปิดจดหมาย</p>
  </div>

  <div id="letterPage" class="letter-page">
    <div class="letter-paper">
      <h2 id="letterTitle"></h2>
      <div id="letterText" class="letter-text"></div>
      <div id="letterSign" class="signature"></div>
    </div>
  </div>

</div>

  let currentLetter = null;
  let typingTimer = null;

  function checkCode(){
    const codeInput = document.getElementById('codeInput');
    const code = codeInput.value.trim();
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.textContent = "";

    if(!code){
      errorMsg.textContent = "ใส่รหัสก่อน";
      return;
    }

    if(!letters[code]){
      errorMsg.textContent = "ใส่รหัสผิด";
      return;
    }

    currentLetter = letters[code];

    document.getElementById('codePage').style.display = 'none';
    document.getElementById('envelopePage').style.display = 'block';
    document.getElementById('senderName').textContent = currentLetter.sender;
  }

  function openEnvelope(){
    const env = document.getElementById('envelope');
    if(!currentLetter) return;
    if(env.classList.contains('open')) return;

    env.classList.add('open');
    setTimeout(openLetter, 900);
  }

  function typeText(el, text, speed=24){
    if(!el || typeof text !== 'string') return;

    el.textContent = "";
    let i = 0;
    clearInterval(typingTimer);

    typingTimer = setInterval(() => {
      if(i < text.length){
        el.textContent += text.charAt(i);
        i++;
      } else {
        clearInterval(typingTimer);
      }
    }, speed);
  }

  function openLetter(){
    if(!currentLetter) return;

    document.getElementById('envelopePage').style.display = 'none';
    document.getElementById('letterPage').style.display = 'block';

    document.getElementById('letterTitle').textContent = currentLetter.name || '';

    const textEl = document.getElementById('letterText');
    typeText(textEl, currentLetter.text || '', 22);

    const sign = document.getElementById('letterSign');
    sign.classList.remove('show');
    sign.textContent = currentLetter.sign || '';

    setTimeout(() => {
      sign.classList.add('show');
    }, 1200);

    window.scrollTo(0,0);
  }

  document.getElementById('confirmBtn').addEventListener('click', checkCode);
  document.getElementById('envelope').addEventListener('click', openEnvelope);

  // allow Enter key
  document.getElementById('codeInput').addEventListener('keypress', function(e){
    if(e.key === 'Enter'){
      checkCode();
    }
  });

  /* ===== TEST CASES ===== */
  console.assert(typeof checkCode === 'function', 'checkCode should be defined');
  console.assert(typeof openEnvelope === 'function', 'openEnvelope should be defined');
  console.assert(typeof openLetter === 'function', 'openLetter should be defined');
  console.assert(typeof typeText === 'function', 'typeText should be defined');
  console.assert(Object.keys(letters).length >= 1, 'There should be at least one letter');
  console.assert(letters['A123'].text.includes('gentle'), 'A123 letter text should contain expected content');
</script>
